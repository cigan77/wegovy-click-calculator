<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Calcolatrice penne Wegovy</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 12px;
      line-height: 1.5;
    }
    h1, h2 {
      margin-bottom: 0.4rem;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    input, select {
      width: 100%;
      padding: 6px 8px;
      margin-top: 2px;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .col {
      flex: 1 1 200px;
    }
    .results p {
      margin: 4px 0;
    }
    .small {
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Calcolatrice penne Wegovy</h1>
  <p class="small">
    ⚠️ Strumento per uso professionale. Le istruzioni ufficiali raccomandano di
    <strong>non impostare la dose contando i click</strong> del selettore.
  </p>

  <div class="card">
    <h2>Impostazioni penna</h2>
    <div class="row">
      <div class="col">
        <label for="pen-select">Tipo di penna</label>
        <select id="pen-select"></select>
      </div>
      <div class="col">
        <label for="clicks-full">Click per dose piena (etichetta)</label>
        <input id="clicks-full" type="number" min="1" step="1" value="80" />
      </div>
      <div class="col">
        <label for="price">Prezzo penna (€)</label>
        <input id="price" type="number" min="0" step="0.01" value="200" />
      </div>
      <div class="col">
        <label for="freq">Iniezioni a settimana</label>
        <input id="freq" type="number" min="0.1" step="0.1" value="1" />
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Dose desiderata</h2>
    <div class="row">
      <div class="col">
        <label for="target-dose">Dose target (mg)</label>
        <input id="target-dose" type="number" min="0.01" step="0.01" value="0.25" />
      </div>
    </div>
  </div>

  <div class="card results">
    <h2>Risultati</h2>
    <p id="dose-info"></p>
    <p id="click-info"></p>
    <p id="duration-info"></p>
    <p id="cost-info"></p>
  </div>

  <script>
    const pens = [
      { id: 'wegovy-0_25', name: 'Wegovy 0,25 mg', labelDoseMg: 0.25, dosesPerPen: 4 },
      { id: 'wegovy-0_5',  name: 'Wegovy 0,5 mg',  labelDoseMg: 0.5,  dosesPerPen: 4 },
      { id: 'wegovy-1',    name: 'Wegovy 1 mg',    labelDoseMg: 1.0,  dosesPerPen: 4 },
      { id: 'wegovy-1_7',  name: 'Wegovy 1,7 mg',  labelDoseMg: 1.7,  dosesPerPen: 4 },
      { id: 'wegovy-2_4',  name: 'Wegovy 2,4 mg',  labelDoseMg: 2.4,  dosesPerPen: 4 },
    ];

    const penSelect   = document.getElementById('pen-select');
    const clicksInput = document.getElementById('clicks-full');
    const priceInput  = document.getElementById('price');
    const freqInput   = document.getElementById('freq');
    const targetInput = document.getElementById('target-dose');

    const doseInfo     = document.getElementById('dose-info');
    const clickInfo    = document.getElementById('click-info');
    const durationInfo = document.getElementById('duration-info');
    const costInfo     = document.getElementById('cost-info');

    // Popola la select
    pens.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.name} (dose etichetta: ${p.labelDoseMg} mg)`;
      penSelect.appendChild(opt);
    });

    function format(num, decimals = 2) {
      if (!isFinite(num)) return '-';
      return num.toFixed(decimals);
    }

    function recalc() {
      const pen = pens.find(p => p.id === penSelect.value);
      if (!pen) return;

      const clicksFull = parseFloat(clicksInput.value);
      const price      = parseFloat(priceInput.value);
      const freq       = parseFloat(freqInput.value);
      const targetDose = parseFloat(targetInput.value);

      if (!clicksFull || !targetDose || !freq) {
        doseInfo.textContent     = 'Compila i campi per vedere i risultati.';
        clickInfo.textContent    = '';
        durationInfo.textContent = '';
        costInfo.textContent     = '';
        return;
      }

      // mg per click in base alla dose etichetta
      const mgPerClick = pen.labelDoseMg / clicksFull;

      // click per la dose desiderata
      const clicksForDose = targetDose / mgPerClick;
      const clicksRounded = Math.round(clicksForDose);

      // quante dosi a quella dose si ottengono da una penna
      const totalMgInPen  = pen.labelDoseMg * pen.dosesPerPen;
      const dosesPerPenAtTarget = totalMgInPen / targetDose;

      // durata in settimane
      const weeks = dosesPerPenAtTarget / freq;

      // costi
      const costPerDose   = price / dosesPerPenAtTarget;
      const costPerWeek   = costPerDose * freq;
      const costPerMonth  = costPerWeek * 4.345; // settimane medie/mese

      doseInfo.textContent =
        `Penna: ${pen.name} – dose etichetta ${pen.labelDoseMg} mg, ` +
        `contenuto totale ~ ${format(totalMgInPen, 2)} mg (` +
        `${pen.dosesPerPen} dosi standard). ` +
        `A una dose di ${format(targetDose, 2)} mg ottieni ~ ${format(dosesPerPenAtTarget, 2)} dosi per penna.`;

      clickInfo.textContent =
        `Stima: ${format(mgPerClick, 4)} mg per click. ` +
        `Per ${format(targetDose, 2)} mg servono ~ ${format(clicksForDose, 1)} click ` +
        `(arrotondato: ${clicksRounded} click).`;

      durationInfo.textContent =
        `Con ${freq} iniezione/i a settimana la penna dura circa ${format(weeks, 2)} settimane.`;

      costInfo.textContent =
        `Costo per dose ~ €${format(costPerDose)}; ` +
        `per settimana ~ €${format(costPerWeek)}; per mese ~ €${format(costPerMonth)}.`;
    }

    penSelect.addEventListener('change', recalc);
    clicksInput.addEventListener('input', recalc);
    priceInput.addEventListener('input', recalc);
    freqInput.addEventListener('input', recalc);
    targetInput.addEventListener('input', recalc);

    // prima elaborazione
    recalc();
  </script>
</body>
</html>
